site_name: PocketTally 开发文档
site_description: PocketTally 数据模型、接口契约与业务规则
site_url: https://louisliunova.github.io/PocketTally/
repo_url: https://github.com/LouisLiuNova/PocketTally
repo_name: LouisLiuNova/PocketTally
docs_dir: .docs-build
site_dir: site
strict: true

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

nav:
  - 首页: index.md
  - 业务规则: business-rules.md
  - 数据模型:
      - 数据库模型: data-models.md
      - HTTP 模型: http-models.md
      - HTTP 模型约定: contracts/models/README.md
  - 接口:
      - 实现状态: api-status.md
      - API 参考: api-reference.html
  - 项目:
      - 当前待办: TODO.md
      - 历史方案: TODO-IMP.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - .docs-build
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js
  - assets/mermaid.js

extra:
  generator: false

copyright: PocketTally 开发文档
