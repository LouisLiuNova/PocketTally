        '422':
          description: 请求参数校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 未预期的服务器内部错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - accounts
      summary: Remove Account
      description: 删除未被历史交易引用的账户。
      operationId: deleteAccount
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: 账户 UUID。
          title: Accountid
        description: 账户 UUID。
      responses:
        '204':
