  /transactions:
    get:
      tags:
      - transactions
      summary: List Transaction Routes
      description: 按组合条件返回分页交易；旧的 ``includeVoided`` 参数已移除。
      operationId: listTransactions
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Pagesize
      - name: startAt
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Startat
      - name: endAt
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Endat
      - name: type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/TransactionType'
          - type: 'null'
          title: Type
      - name: accountId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Accountid
      - name: sourceAccountId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Sourceaccountid
      - name: destinationAccountId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Destinationaccountid
      - name: categoryId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Categoryid
      - name: includeDescendants
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Includedescendants
      - name: tagId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Tagid
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: status
        in: query
        required: false
        schema:
          enum:
          - active
          - voided
          - all
          type: string
          default: active
          title: Status
      - name: refundOfTransactionId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Refundoftransactionid
      - name: sortBy
        in: query
        required: false
        schema:
          enum:
          - occurredAt
          - amount
          type: string
          default: occurredAt
          title: Sortby
      - name: sortOrder
        in: query
        required: false
        schema:
          enum:
          - asc
          - desc
          type: string
          default: desc
          title: Sortorder
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '422':
          description: 请求参数校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 未预期的服务器内部错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - transactions
      summary: Create Transaction Route
      description: 创建一笔经过完整矩阵校验的基础交易。
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
