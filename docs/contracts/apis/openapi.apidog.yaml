openapi: 3.1.0
info:
  title: PocketTally HTTP API
  version: 0.1.0
  description: PocketTally 资源 API；基础资源维护与交易读取已实现，交易写入仍在设计中。
servers:
  - url: /api/v1
tags:
  - name: Accounts
    description: Account and balance management.
  - name: Categories
    description: Transaction category management.
  - name: Tags
    description: Transaction tag management.
  - name: Transactions
    description: Financial transaction management.
paths:
  /accounts:
    get:
      tags:
        - Accounts
      operationId: listAccounts
      summary: List accounts
      responses:
        '200':
          description: Accounts returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/account.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Accounts
      operationId: createAccount
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/account.create.schema'
      responses:
        '201':
          description: Account created successfully.
          headers:
            Location:
              description: URL of the newly created account.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Error'
  /accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags:
        - Accounts
      operationId: getAccount
      summary: Get an account
      responses:
        '200':
          description: Account returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'
    patch:
      tags:
        - Accounts
      operationId: updateAccount
      summary: Update an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/account.update.schema'
      responses:
        '200':
          description: Account updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/account.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Accounts
      operationId: deleteAccount
      summary: Delete an account
      responses:
        '204':
          description: Account deleted successfully. No response body.
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Error'
  /categories:
    get:
      tags:
        - Categories
      operationId: listCategories
      summary: List categories
      responses:
        '200':
          description: Categories returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/category.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Categories
      operationId: createCategory
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/category.create.schema'
      responses:
        '201':
          description: Category created successfully.
          headers:
            Location:
              description: URL of the newly created category.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/category.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Error'
  /categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    get:
      tags:
        - Categories
      operationId: getCategory
      summary: Get a category
      responses:
        '200':
          description: Category returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/category.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'
    patch:
      tags:
        - Categories
      operationId: updateCategory
      summary: Update a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/category.update.schema'
      responses:
        '200':
          description: Category updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/category.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Categories
      operationId: deleteCategory
      summary: Delete a category
      responses:
        '204':
          description: Category deleted successfully. No response body.
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Error'
  /tags:
    get:
      tags:
        - Tags
      operationId: listTags
      summary: List tags
      responses:
        '200':
          description: Tags returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/tag.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Tags
      operationId: createTag
      summary: Create a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tag.create.schema'
      responses:
        '201':
          description: Tag created successfully.
          headers:
            Location:
              description: URL of the newly created tag.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tag.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Error'
  /tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagId'
    get:
      tags:
        - Tags
      operationId: getTag
      summary: Get a tag
      responses:
        '200':
          description: Tag returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tag.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'
    patch:
      tags:
        - Tags
      operationId: updateTag
      summary: Update a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tag.update.schema'
      responses:
        '200':
          description: Tag updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tag.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Tags
      operationId: deleteTag
      summary: Delete a tag
      responses:
        '204':
          description: Tag deleted successfully. No response body.
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Error'
  /transactions:
    get:
      tags:
        - Transactions
      operationId: listTransactions
      summary: List transactions
      parameters:
        - name: includeVoided
          in: query
          required: false
          description: 是否包含已作废交易，默认仅返回有效交易。
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Transactions returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/transaction.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags:
        - Transactions
      operationId: createTransaction
      summary: Create a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transaction.create.schema'
      responses:
        '201':
          description: Transaction created successfully.
          headers:
            Location:
              description: URL of the newly created transaction.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transaction.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Error'
  /transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      tags:
        - Transactions
      operationId: getTransaction
      summary: Get a transaction
      responses:
        '200':
          description: Transaction returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transaction.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'
    patch:
      tags:
        - Transactions
      operationId: updateTransaction
      summary: Update a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/transaction.update.schema'
      responses:
        '200':
          description: Transaction updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transaction.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/Error'
  /transactions/{transactionId}/void:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    post:
      tags:
        - Transactions
      operationId: voidTransaction
      summary: Void a transaction idempotently
      responses:
        '200':
          description: Transaction voided or existing void result returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/transaction.read.schema'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Error'
components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: Account UUID.
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Category UUID.
      schema:
        type: string
        format: uuid
    TagId:
      name: tagId
      in: path
      required: true
      description: Tag UUID.
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transactionId
      in: path
      required: true
      description: Transaction UUID.
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          description: 可选的结构化错误详情；请求校验失败时为字段错误数组。
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
    uuid:
      type: string
      format: uuid
    nullableString:
      type:
        - string
        - 'null'
    dateTime:
      type: string
      format: date-time
    transactionType:
      type: string
      enum:
        - income
        - expense
        - transfer
        - balance_adjustment
    balanceAdjustmentDirection:
      type: string
      enum:
        - increase
        - decrease
    accountType:
      type: string
      enum:
        - debit
        - credit
    categoryPurpose:
      type: string
      enum:
        - income
        - expense
    account.read.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.pockettally.app/models/account.read.schema.json
      title: AccountRead
      description: Account returned by the HTTP API.
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              type:
                const: debit
          then:
            properties:
              amount:
                minimum: 0
      required:
        - id
        - type
        - name
        - cardNumber
        - description
        - amount
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        type:
          $ref: '#/components/schemas/accountType'
        name:
          type: string
          minLength: 1
        cardNumber:
          $ref: '#/components/schemas/nullableString'
        description:
          $ref: '#/components/schemas/nullableString'
        amount:
          type: number
          description: CNY 金额；服务端内部以整数分存储。
        createdAt:
          $ref: '#/components/schemas/dateTime'
        updatedAt:
          $ref: '#/components/schemas/dateTime'
    account.create.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.pockettally.app/models/account.create.schema.json
      title: AccountCreate
      description: New accounts always start with a zero balance. Server-owned fields are omitted.
      type: object
      additionalProperties: false
      required:
        - type
        - name
      properties:
        type:
          $ref: '#/components/schemas/accountType'
        name:
          type: string
          minLength: 1
        cardNumber:
          $ref: '#/components/schemas/nullableString'
        description:
          $ref: '#/components/schemas/nullableString'
    account.update.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.pockettally.app/models/account.update.schema.json
      title: AccountUpdate
      description: Partial payload for updating an account.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        type:
          $ref: '#/components/schemas/accountType'
        name:
          type: string
          minLength: 1
        cardNumber:
          $ref: '#/components/schemas/nullableString'
        description:
          $ref: '#/components/schemas/nullableString'
    hexColor:
      type: string
      pattern: ^#[0-9A-Fa-f]{6}$
      examples:
        - '#ff0000'
    categorySummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - purpose
        - iconColor
        - iconName
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          minLength: 1
        purpose:
          $ref: '#/components/schemas/categoryPurpose'
        iconColor:
          $ref: '#/components/schemas/hexColor'
        iconName:
          type: string
          minLength: 1
    category.read.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.pockettally.app/models/category.read.schema.json
      title: CategoryRead
      description: Category returned by the HTTP API. The parent is embedded as a bounded summary.
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - purpose
        - description
        - parentCategory
        - iconColor
        - iconName
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          minLength: 1
        purpose:
          $ref: '#/components/schemas/categoryPurpose'
        description:
          $ref: '#/components/schemas/nullableString'
        parentCategory:
          oneOf:
            - $ref: '#/components/schemas/categorySummary'
            - type: 'null'
        iconColor:
          $ref: '#/components/schemas/hexColor'
        iconName:
          type: string
          minLength: 1
        createdAt:
          $ref: '#/components/schemas/dateTime'
        updatedAt:
          $ref: '#/components/schemas/dateTime'
    category.create.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.pockettally.app/models/category.create.schema.json
      title: CategoryCreate
      description: Payload for creating a category. Relationships are represented by IDs.
      type: object
      additionalProperties: false
      required:
        - name
        - purpose
      properties:
        name:
          type: string
          minLength: 1
        purpose:
          $ref: '#/components/schemas/categoryPurpose'
        description:
          $ref: '#/components/schemas/nullableString'
        parentCategoryId:
          oneOf:
            - $ref: '#/components/schemas/uuid'
            - type: 'null'
        iconColor:
          $ref: '#/components/schemas/hexColor'
          default: '#ff0000'
        iconName:
          type: string
          minLength: 1
          default: default_icon
    category.update.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.pockettally.app/models/category.update.schema.json
      title: CategoryUpdate
      description: Partial payload for updating a category. Purpose is immutable.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        description:
          $ref: '#/components/schemas/nullableString'
        parentCategoryId:
          oneOf:
            - $ref: '#/components/schemas/uuid'
            - type: 'null'
        iconColor:
          $ref: '#/components/schemas/hexColor'
        iconName:
          type: string
          minLength: 1
    tag.read.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.pockettally.app/models/tag.read.schema.json
      title: TagRead
      description: Tag returned by the HTTP API.
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - description
        - color
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          minLength: 1
        description:
          $ref: '#/components/schemas/nullableString'
        color:
          $ref: '#/components/schemas/hexColor'
        createdAt:
          $ref: '#/components/schemas/dateTime'
        updatedAt:
          $ref: '#/components/schemas/dateTime'
    tag.create.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.pockettally.app/models/tag.create.schema.json
      title: TagCreate
      description: Payload for creating a tag.
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        description:
          $ref: '#/components/schemas/nullableString'
        color:
          $ref: '#/components/schemas/hexColor'
          default: '#ff0000'
    tag.update.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.pockettally.app/models/tag.update.schema.json
      title: TagUpdate
      description: Partial payload for updating a tag.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
        description:
          $ref: '#/components/schemas/nullableString'
        color:
          $ref: '#/components/schemas/hexColor'
    accountSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - name
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        type:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    tagSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - color
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        name:
          type: string
          minLength: 1
        color:
          $ref: '#/components/schemas/hexColor'
    transactionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - amount
        - description
        - occurredAt
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        type:
          $ref: '#/components/schemas/transactionType'
        amount:
          type: number
          exclusiveMinimum: 0
          description: CNY 金额；服务端内部以整数分存储。
        description:
          $ref: '#/components/schemas/nullableString'
        occurredAt:
          $ref: '#/components/schemas/dateTime'
        createdAt:
          $ref: '#/components/schemas/dateTime'
    transaction.read.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.pockettally.app/models/transaction.read.schema.json
      title: TransactionRead
      description: Transaction returned by the HTTP API. Relationships are embedded as bounded read summaries.
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - sourceAccount
        - destinationAccount
        - amount
        - description
        - category
        - tags
        - isRefund
        - relatedTransaction
        - balanceAdjustmentDirection
        - isVoid
        - voidedAt
        - occurredAt
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        type:
          $ref: '#/components/schemas/transactionType'
        sourceAccount:
          oneOf:
            - $ref: '#/components/schemas/accountSummary'
            - type: 'null'
        destinationAccount:
          oneOf:
            - $ref: '#/components/schemas/accountSummary'
            - type: 'null'
        amount:
          type: number
          exclusiveMinimum: 0
          description: CNY 金额；按 ROUND_HALF_UP 舍入到分后必须仍为正数。
        description:
          $ref: '#/components/schemas/nullableString'
        category:
          oneOf:
            - $ref: '#/components/schemas/categorySummary'
            - type: 'null'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/tagSummary'
          uniqueItems: true
        isRefund:
          type: boolean
        relatedTransaction:
          oneOf:
            - $ref: '#/components/schemas/transactionSummary'
            - type: 'null'
        balanceAdjustmentDirection:
          oneOf:
            - $ref: '#/components/schemas/balanceAdjustmentDirection'
            - type: 'null'
        isVoid:
          type: boolean
        voidedAt:
          oneOf:
            - $ref: '#/components/schemas/dateTime'
            - type: 'null'
        occurredAt:
          $ref: '#/components/schemas/dateTime'
        createdAt:
          $ref: '#/components/schemas/dateTime'
        updatedAt:
          $ref: '#/components/schemas/dateTime'
    balance-adjustment.create.schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://schemas.pockettally.app/models/balance-adjustment.create.schema.json
