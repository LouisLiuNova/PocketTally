openapi: 3.1.0
info:
  title: PocketTally API
  version: 0.1.0
  description: PocketTally 资源、交易查询、退款摘要与六类统计 API。
paths:
  /health:
    get:
      tags:
      - health
      summary: Service liveness and readiness
      description: "返回服务存活状态、就绪状态、版本和运行时间信息。\n\nArgs:\n    context: 请求范围内的配置、资源和请求标识。\n\
        \nReturns:\n    可兼容 JSON 的健康状态数据。"
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: string
                  - type: number
                  - type: boolean
                type: object
                title: Response Health Api V1 Health Get
  /accounts:
    get:
      tags:
      - accounts
      summary: List Accounts
      description: 按创建时间和 ID 返回全部账户。
      operationId: listAccounts
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccountRead'
                type: array
                title: Response Listaccounts
        '422':
          description: 请求参数校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 未预期的服务器内部错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - accounts
      summary: Create Account Route
      description: 创建零余额账户。
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRead'
        '409':
          description: 操作与当前数据或业务规则冲突。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 请求参数校验失败。
          content:
            application/json:
