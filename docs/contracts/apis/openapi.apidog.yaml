components:
  schemas:
    AccountCreate:
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        name:
          type: string
          minLength: 1
          title: Name
        cardNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Cardnumber
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      additionalProperties: false
      type: object
      required:
      - type
      - name
      title: AccountCreate
      description: 创建账户的请求模型。
    AccountRead:
      allOf:
      - if:
          properties:
            type:
              const: debit
        then:
          properties:
            amount:
              minimum: 0.0
      properties:
        id:
          type: string
          format: uuid
          title: Id
        type:
          $ref: '#/components/schemas/AccountType'
        name:
          type: string
          minLength: 1
          title: Name
        cardNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Cardnumber
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        amount:
          type: number
          title: Amount
          description: CNY 金额；服务端接收后按 ROUND_HALF_UP 舍入到分。
          examples:
          - 12.34
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
      additionalProperties: false
      type: object
      required:
      - id
      - type
      - name
      - cardNumber
      - description
      - amount
      - createdAt
      - updatedAt
      title: AccountRead
      description: 账户响应模型。
    AccountSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        type:
          $ref: '#/components/schemas/AccountType'
        name:
          type: string
          minLength: 1
          title: Name
      additionalProperties: false
      type: object
      required:
      - id
      - type
      - name
      title: AccountSummary
      description: 事务中嵌入的账户有界摘要。
    AccountType:
      type: string
      enum:
      - debit
      - credit
      title: AccountType
      description: 系统支持的账户类型。
    AccountUpdate:
      properties:
        type:
          $ref: '#/components/schemas/AccountType'
        name:
          type: string
          minLength: 1
          title: Name
        cardNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Cardnumber
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      additionalProperties: false
      type: object
      minProperties: 1
      title: AccountUpdate
      description: 部分更新账户的请求模型。
    BalanceAdjustmentDirection:
      type: string
      enum:
      - increase
      - decrease
      title: BalanceAdjustmentDirection
      description: 余额调整的资金方向。
    CalendarDay:
      properties:
        date:
          type: string
          format: date
          title: Date
        incomeAmountMinor:
          type: integer
          title: Incomeamountminor
        refundAmountMinor:
          type: integer
          title: Refundamountminor
        expenseAmountMinor:
          type: integer
          title: Expenseamountminor
        netCashFlowMinor:
          type: integer
          title: Netcashflowminor
      additionalProperties: false
      type: object
      required:
      - date
      - incomeAmountMinor
      - refundAmountMinor
      - expenseAmountMinor
      - netCashFlowMinor
      title: CalendarDay
    CalendarResponse:
      properties:
        period:
          $ref: '#/components/schemas/Period'
        month:
          type: string
          title: Month
        days:
          items:
            $ref: '#/components/schemas/CalendarDay'
          type: array
          title: Days
      additionalProperties: false
      type: object
      required:
      - period
      - month
      - days
      title: CalendarResponse
    CashFlowBucket:
      properties:
        startAt:
          type: string
          format: date-time
          title: Startat
        endAt:
          type: string
          format: date-time
          title: Endat
        incomeAmountMinor:
          type: integer
          title: Incomeamountminor
        refundAmountMinor:
          type: integer
          title: Refundamountminor
        expenseAmountMinor:
          type: integer
          title: Expenseamountminor
        netCashFlowMinor:
          type: integer
          title: Netcashflowminor
      additionalProperties: false
      type: object
      required:
      - startAt
      - endAt
      - incomeAmountMinor
      - refundAmountMinor
      - expenseAmountMinor
      - netCashFlowMinor
      title: CashFlowBucket
    CashFlowResponse:
      properties:
        period:
          $ref: '#/components/schemas/Period'
        granularity:
          type: string
          enum:
          - day
          - week
          - month
          title: Granularity
        buckets:
          items:
            $ref: '#/components/schemas/CashFlowBucket'
          type: array
          title: Buckets
      additionalProperties: false
      type: object
      required:
      - period
      - granularity
      - buckets
      title: CashFlowResponse
    CategoriesResponse:
      properties:
        period:
          $ref: '#/components/schemas/Period'
        parentCategoryId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Parentcategoryid
        granularity:
          type: string
          enum:
          - day
          - week
          - month
          title: Granularity
          default: month
        items:
          items:
            $ref: '#/components/schemas/CategoryAmount'
          type: array
          title: Items
        topCategories:
          items:
            $ref: '#/components/schemas/CategoryAmount'
          type: array
          title: Topcategories
        other:
          $ref: '#/components/schemas/OtherCategory'
        buckets:
          items:
            $ref: '#/components/schemas/ExpenseBucket'
          type: array
          title: Buckets
      additionalProperties: false
      type: object
      required:
      - period
      - parentCategoryId
      - items
      - topCategories
      - other
      - buckets
      title: CategoriesResponse
    CategoryAmount:
      properties:
        categoryId:
          type: string
          format: uuid
          title: Categoryid
        name:
          type: string
          title: Name
        purpose:
          type: string
          const: expense
          title: Purpose
        amountMinor:
          type: integer
          title: Amountminor
        directAmountMinor:
          type: integer
          title: Directamountminor
        previousAmountMinor:
          type: integer
          title: Previousamountminor
        changeAmountMinor:
          type: integer
          title: Changeamountminor
        changeContributionMinor:
          type: integer
          title: Changecontributionminor
        children:
          items:
            $ref: '#/components/schemas/CategoryAmount'
          type: array
          title: Children
        timeBuckets:
          items:
            $ref: '#/components/schemas/CategoryBucket'
          type: array
          title: Timebuckets
      additionalProperties: false
      type: object
      required:
      - categoryId
      - name
      - purpose
      - amountMinor
      - directAmountMinor
      - previousAmountMinor
      - changeAmountMinor
      - changeContributionMinor
      title: CategoryAmount
    CategoryBucket:
      properties:
        startAt:
          type: string
          format: date-time
