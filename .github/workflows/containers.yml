name: Containers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Validate backend
        working-directory: backend
        run: |
          uv sync --frozen --group docs
          uv run pytest -q
          uvx ruff check .
          uv run --group docs python ../scripts/docs.py check
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Validate frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build
      - name: Validate Compose
        run: docker compose config --quiet

  container-smoke:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            slug: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      POCKET_TALLY_BACKEND_IMAGE: pockettally-backend-smoke
      POCKET_TALLY_FRONTEND_IMAGE: pockettally-frontend-smoke
      POCKET_TALLY_IMAGE_TAG: ${{ matrix.slug }}
      POCKET_TALLY_DATA_DIR: ${{ github.workspace }}/.container-smoke/${{ matrix.slug }}/data
      POCKET_TALLY_BACKUP_DIR: ${{ github.workspace }}/.container-smoke/${{ matrix.slug }}/backups
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          platforms: ${{ matrix.platform }}
          tags: pockettally-backend-smoke:${{ matrix.slug }}
          build-args: |
            APP_VERSION=0.1.0
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.slug }}
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          platforms: ${{ matrix.platform }}
          tags: pockettally-frontend-smoke:${{ matrix.slug }}
          build-args: |
            APP_VERSION=0.1.0
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=frontend-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.slug }}
      - name: Start and verify Compose services
        run: |
          mkdir -p "$POCKET_TALLY_DATA_DIR" "$POCKET_TALLY_BACKUP_DIR"
          docker compose up -d --no-build
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:54425/api/v1/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose ps
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          backend_id=$(docker compose ps -q backend)
          test "$(docker inspect "$backend_id" --format '{{json (index .NetworkSettings.Ports "8000/tcp")}}')" = "null"
          curl --fail --silent http://127.0.0.1:54425/ >/dev/null
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"type":"credit","name":"container-persistence"}' \
            http://127.0.0.1:54425/api/v1/accounts >/dev/null
          docker compose restart backend
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:54425/api/v1/accounts | grep -q container-persistence; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done
          backup_name=$(docker compose run --rm --no-deps backup create | tail -n 1)
          docker compose run --rm --no-deps backup verify "$backup_name"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Compose services
        if: always()
        run: docker compose down --remove-orphans

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: container-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate release version
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          project_version=$(python -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version'])")
          test "$release_version" = "$project_version"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/louisliunova/pockettally-backend
            iridium191/pocket-tally-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/louisliunova/pockettally-frontend
            iridium191/pocket-tally-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.backend-meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,mode=max,scope=backend-release
      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.frontend-meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=frontend-release
          cache-to: type=gha,mode=max,scope=frontend-release
      - name: Verify published manifests
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker logout ghcr.io
          docker logout
          docker buildx imagetools inspect "ghcr.io/louisliunova/pockettally-backend:$version"
          docker buildx imagetools inspect "ghcr.io/louisliunova/pockettally-frontend:$version"
          docker buildx imagetools inspect "iridium191/pocket-tally-backend:$version"
          docker buildx imagetools inspect "iridium191/pocket-tally-frontend:$version"
