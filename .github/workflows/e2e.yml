name: Frontend E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-e2e:
    name: Chromium E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install Chromium and Linux dependencies
        working-directory: frontend
        run: bun --bun playwright install --with-deps chromium
      - name: Build frontend for E2E
        working-directory: frontend
        run: bun run build
      - name: Start isolated E2E services
        env:
          E2E_DIR: ${{ runner.temp }}/pockettally-e2e
        run: |
          set -euo pipefail
          mkdir -p "$E2E_DIR" frontend/test-results/ci-logs
          database="$E2E_DIR/e2e.sqlite3"
          backend_log="$E2E_DIR/backend.log"
          frontend_log="$E2E_DIR/frontend.log"

          (
            cd backend
            exec env POCKET_TALLY_DATABASE_PATH="$database" \
              uv run uvicorn app.main:app --host 127.0.0.1 --port 8012
          ) >"$backend_log" 2>&1 &
          echo $! >"$E2E_DIR/backend.pid"
          (
            cd frontend
            exec env HOST=127.0.0.1 PORT=3012 NUXT_API_BASE=http://127.0.0.1:8012 \
              bun run preview
          ) >"$frontend_log" 2>&1 &
          echo $! >"$E2E_DIR/frontend.pid"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8012/api/v1/accounts >/dev/null \
              && curl --fail --silent http://127.0.0.1:3012/ >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$E2E_DIR/backend.pid")" 2>/dev/null \
              || ! kill -0 "$(cat "$E2E_DIR/frontend.pid")" 2>/dev/null; then
              cat "$backend_log"
              cat "$frontend_log"
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              cat "$backend_log"
              cat "$frontend_log"
              exit 1
            fi
            sleep 2
          done
      - name: Run Chromium 1280 1440 1920 matrix
        working-directory: frontend
        env:
          CI: true
          POCKET_TALLY_E2E_DATABASE_PATH: ${{ runner.temp }}/pockettally-e2e/e2e.sqlite3
        run: bun run test:e2e:matrix
      - name: Stop isolated E2E services
        if: always()
        env:
          E2E_DIR: ${{ runner.temp }}/pockettally-e2e
        run: |
          for pid_file in "$E2E_DIR/backend.pid" "$E2E_DIR/frontend.pid"; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
      - name: Collect E2E service logs
        if: always()
        env:
          E2E_DIR: ${{ runner.temp }}/pockettally-e2e
        run: |
          mkdir -p frontend/test-results/ci-logs
          for log_file in "$E2E_DIR/backend.log" "$E2E_DIR/frontend.log"; do
            if [ -f "$log_file" ]; then
              cp "$log_file" frontend/test-results/ci-logs/
            fi
          done
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-failure-${{ github.run_id }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
